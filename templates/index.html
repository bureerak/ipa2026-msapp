<html>
<head>
    <title>Sample app</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <h1>You are calling me from {{request.remote_addr}}</h1>
    <form method="POST" action="/add">
      <input name="ip" placeholder="Router's IP" required />
      <input name="username" placeholder="Username" required />
      <input name="password" placeholder="Password" required />
      <button type="submit">Add</button>
    </form>

  <ul>
    {% for comment in data %}
      <li>
        <a href="{{ url_for('show_route', ip=comment.ip) }}">Show Route</a>
        {{ comment.ip }} - {{ comment.username }}
        <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
          <input type="hidden" name="ip" value="{{ comment.ip }}">
          <input type="hidden" name="username" value="{{ comment.username }}">
          <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>

</body>
</html>
